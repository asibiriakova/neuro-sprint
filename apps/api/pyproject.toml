[project]
name = "neuro-sprint-api"
version = "0.1.0"
description = "NeuroSprint FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
