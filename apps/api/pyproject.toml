[project]
name = "neuro-sprint-api"
version = "0.1.0"
description = "NeuroSprint FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.5",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.6",
    "black>=26.5.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
target-version = ["py311"]
